name: B04 isolated Android verification

on:
  push:
    branches: [codex/b04-android-verification-guide]
    paths:
      - .github/workflows/b04-android-verification.yml
      - integration_test/**
      - test/b04_probe_app_test.dart
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b04-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Official Flutter source, fixed release
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.38.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse --short=10 HEAD)" = f6ff1529fd
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Configure disposable Android package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          old = 'applicationId = "com.example.siraj"'
          text = p.read_text()
          assert text.count(old) == 1, 'Unexpected Gradle structure; do not guess application ID'
          p.write_text(text.replace(old, 'applicationId = "com.example.siraj.b04verification"'))
          PY
          flutter --version
          dart --version
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test --reporter expanded
      - name: Install official Android emulator components
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME" || { echo '::error title=B04 checkpoint::ANDROID_HOME missing'; exit 1; }
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          command -v sdkmanager || { echo '::error title=B04 checkpoint::sdkmanager not found in the official SDK cmdline-tools/latest/bin'; exit 1; }
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          executable = Path(os.environ['ANDROID_HOME']) / 'cmdline-tools/latest/bin/sdkmanager'
          with (Path(os.environ['RUNNER_TEMP']) / 'b04-licenses.log').open('w') as log:
              subprocess.run([str(executable), '--licenses'], input='y\n' * 100, text=True, stdout=log, stderr=subprocess.STDOUT, check=True)
          PY
          if ! sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;35.0.0' 'system-images;android-33;google_apis;x86_64' > "$RUNNER_TEMP/b04-sdk.log" 2>&1; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'b04-sdk.log').read_text(errors='replace')[-2000:]
          print('::error title=B04 sdkmanager::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit 1
          fi
          if [ ! -f "$ANDROID_HOME/system-images/android-33/google_apis/x86_64/package.xml" ]; then
            echo '::error title=B04 checkpoint::sdkmanager returned without the required API33 image; inspect official SDK licensing/install output'
            exit 1
          fi
          echo '::notice title=B04 checkpoint::Official SDK components installed'
      - name: Build isolated probe APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub --target integration_test/support/b04_probe_app.dart
          cp build/app/outputs/flutter-apk/app-debug.apk build/b04-probe-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/b04-probe-debug.apk > b04-apk-package.txt
          grep -F "package: name='com.example.siraj.b04verification'" b04-apk-package.txt
          echo '::notice title=B04 APK::Isolated probe APK built; application ID verified: com.example.siraj.b04verification'
      - name: Boot disposable Android emulator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/b04-android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          if ! echo no | avdmanager create avd --force --name siraj-b04-api33 --path "$ANDROID_AVD_HOME/siraj-b04-api33.avd" --package 'system-images;android-33;google_apis;x86_64' > "$RUNNER_TEMP/b04-avd.log" 2>&1; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'b04-avd.log').read_text(errors='replace')[-2000:]
          print('::error title=B04 avdmanager::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit 1
          fi
          test -f "$ANDROID_AVD_HOME/siraj-b04-api33.ini" || { echo '::error title=B04 checkpoint::AVD ini was not created in explicit ANDROID_AVD_HOME'; exit 1; }
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx siraj-b04-api33
          test -e /dev/kvm || { echo '::error title=B04 checkpoint::KVM unavailable on runner'; exit 1; }
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd siraj-b04-api33 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/b04-emulator.log" 2>&1 &
          emulator_pid=$!
          report_emulator_failure() {
            python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'b04-emulator.log').read_text(errors='replace')[-3000:]
          print('::error title=B04 emulator diagnostics::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          }
          sleep 10
          if ! kill -0 "$emulator_pid" 2>/dev/null; then
            report_emulator_failure
            exit 1
          fi
          if ! timeout 300 adb wait-for-device; then
            echo '::error title=B04 checkpoint::Timed out waiting for emulator ADB device'
            report_emulator_failure
            exit 124
          fi
          if ! timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'; then
            echo '::error title=B04 checkpoint::Timed out waiting for sys.boot_completed'
            report_emulator_failure
            exit 124
          fi
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          flutter devices
      - name: Actual Android Keystore and candidate KDF tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test integration_test/b04_android_secure_session_test.dart -d emulator-5554 --no-pub --reporter expanded
          echo '::notice title=B04 native session::Android Keystore and SQLite session test passed on API33 emulator'
          flutter test integration_test/b04_android_kdf_metrics_test.dart -d emulator-5554 --no-pub --reporter expanded | tee "$RUNNER_TEMP/b04-kdf-metrics.log"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'b04-kdf-metrics.log').read_text()
          match = re.search(r'SIRAJ_B04_METRICS (\{[^\n]+\})', text)
          assert match, 'Successful metric test must publish its synthetic result'
          metrics = json.loads(match.group(1))
          assert set(metrics) == {'platform', 'samples', 'cancel_settlement_ms', 'production_approved', 'note'}
          output = json.dumps(metrics, separators=(',', ':'))
          print('::notice title=B04 Android metrics::' + output.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Record evidence limits
        if: always()
        shell: bash
        run: |
          printf '%s\n' "SHA=$GITHUB_SHA" 'Runner: ubuntu-24.04, API33 Google APIs x86_64 emulator' 'This is not Samsung/physical-device acceptance.' 'No production KDF approval or security-gate activation.' > b04-evidence-limits.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: b04-isolated-android-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/b04-probe-debug.apk
            b04-apk-package.txt
            b04-evidence-limits.txt
