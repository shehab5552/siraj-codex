name: SIRAJ unified integration verification
on:
  push:
    branches: [codex/unified-siraj-v2-integration-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-test-and-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.38.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse --short=10 HEAD)" = f6ff1529fd
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies and static analysis
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
      - name: Flutter tests
        run: flutter test --no-pub
      - name: Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          python3 - <<'PY'
          import subprocess
          subprocess.run(['sdkmanager', '--licenses'], input='y\n' * 100, text=True, check=True)
          PY
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build isolated unified Android debug APK
        run: |
          flutter build apk --debug --no-pub --target=lib/main.dart
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/SIRAJ_P0_UNIFIED_ANDROID_DEBUG.apk
          git archive --format=zip --prefix=SIRAJ_P0/ HEAD -o dist/SIRAJ_P0_FLUTTER_SOURCE.zip
          sha256sum dist/*.apk dist/*.zip > dist/SHA256SUMS
          flutter build apk --release --no-pub --target=lib/main.dart
      - name: Install Android runtime test image
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager 'emulator' 'system-images;android-33;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/siraj-android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name siraj-unified --path "$ANDROID_AVD_HOME/siraj-unified.avd" --package 'system-images;android-33;google_apis;x86_64'
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd siraj-unified -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/unified-emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Actual Android native KDF compatibility
        shell: bash
        run: |
          set -euo pipefail
          flutter test integration_test/unified_native_kdf_test.dart -d emulator-5554 --no-pub --reporter expanded | tee dist/android-native-kdf.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: siraj-unified-application-${{ github.sha }}
          retention-days: 7
          path: dist/
