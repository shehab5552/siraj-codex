name: SIRAJ unified integration verification
on:
  push:
    branches: [codex/unified-siraj-v2-integration-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-test-and-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.38.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse --short=10 HEAD)" = f6ff1529fd
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies and static analysis
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
      - name: Flutter tests
        run: flutter test --no-pub
      - name: Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          python3 - <<'PY'
          import subprocess
          subprocess.run(['sdkmanager', '--licenses'], input='y\n' * 100, text=True, check=True)
          PY
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build isolated unified Android debug APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          source=path.read_text()
          old='applicationId = "com.example.siraj"'
          assert source.count(old)==1
          path.write_text(source.replace(old,'applicationId = "com.example.siraj.unifiedpreview"'))
          PY
          flutter build apk --debug --no-pub
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/siraj-unified-preview-debug.apk
          sha256sum dist/siraj-unified-preview-debug.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: siraj-unified-preview-apk-${{ github.sha }}
          retention-days: 7
          path: dist/
