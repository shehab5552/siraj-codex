name: B07 resource intake verification

on:
  push:
    branches: [codex/b07-independent-download-01]
  pull_request:
    branches: [main]
    paths:
      - 'tool/**'
      - 'lib/features/resources/**'
      - 'test/b07_*'
      - 'integration_test/b07_*'
      - '.github/workflows/b07-resource-intake-verification.yml'

permissions:
  contents: read

concurrency:
  group: b07-intake-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  host-and-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib/features/resources/download_staging.dart test/b07_download_service_test.dart tool/staging_resource_integrity_probe.dart integration_test/b07_download_storage_test.dart
      - run: flutter analyze --no-pub
      - name: Full Flutter regression
        run: flutter test --no-pub --machine > "$RUNNER_TEMP/flutter-tests.jsonl"
      - name: Adversarial static intake tests
        run: python3 -B -m unittest discover -s tool/tests -v
      - name: Download pinned STAGING artifacts outside the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/b07-intake" "$RUNNER_TEMP/b07-evidence"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/siraj-ai-resources-staging-v1" > "$RUNNER_TEMP/b07-intake/release.json"
          gh release download siraj-ai-resources-staging-v1 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/b07-intake" --pattern Biology.zip --pattern embeddinggemma-2-text-270m.litertlm --pattern litertlm-android-0.19.0.aar --pattern Qwen3-0.6B.litertlm --pattern SIRAJ_AI_RESOURCES_MANIFEST.json
      - name: Actual bytes, strict manifest and nested archive audit
        run: python3 -B tool/resource_intake_audit.py "$RUNNER_TEMP/b07-intake" --release-json "$RUNNER_TEMP/b07-intake/release.json" > "$RUNNER_TEMP/b07-evidence/static-intake.json"
      - name: Existing Dart integrity and format policy
        run: dart run tool/staging_resource_integrity_probe.dart "$RUNNER_TEMP/b07-intake" "$RUNNER_TEMP/b07-evidence/dart-validators.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b07-small-intake-evidence
          retention-days: 14
          path: |
            ${{ runner.temp }}/b07-evidence/*.json
            ${{ runner.temp }}/flutter-tests.jsonl
          if-no-files-found: warn

  android-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable emulator KVM
        run: sudo chmod 666 /dev/kvm
      - name: Native Android storage boundary (no AI AAR linked)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/b07_download_storage_test.dart --no-pub -d emulator-5554 --reporter expanded
